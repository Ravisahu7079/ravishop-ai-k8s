apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ravishop-ai
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ravisahu7079/ravishop-ai-k8s.git
    targetRevision: HEAD
    path: manifests/app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
