# Prometheus + Grafana Helm Values
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -f helm-values.yml

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 7d
    additionalScrapeConfigs:
      - job_name: 'ravishop-ai'
        static_configs:
          - targets: ['ravishop-ai-service:5000']
        metrics_path: '/metrics'

grafana:
  enabled: true
  adminPassword: "ravishop2026"
  service:
    type: NodePort
    nodePort: 32000
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'ravishop'
          folder: 'RaviShop AI'
          type: file
          options:
            path: /var/lib/grafana/dashboards/ravishop

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
    receivers:
      - name: 'web.hook'
        webhook_configs:
          - url: 'http://ravishop-ai-service:5000/alerts'

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
