# CloudWatch Alarms — Phase 10 mein terraform se deploy honge

alarms:
  # EC2 CPU High
  ec2_cpu_high:
    alarm_name: "ravishop-ai-ec2-cpu-high"
    comparison_operator: "GreaterThanThreshold"
    evaluation_periods: 2
    metric_name: "CPUUtilization"
    namespace: "AWS/EC2"
    period: 300
    statistic: "Average"
    threshold: 80
    alarm_description: "EC2 CPU > 80% for 10 minutes"
    actions_enabled: true

  # RDS CPU High
  rds_cpu_high:
    alarm_name: "ravishop-ai-rds-cpu-high"
    comparison_operator: "GreaterThanThreshold"
    evaluation_periods: 2
    metric_name: "CPUUtilization"
    namespace: "AWS/RDS"
    period: 300
    statistic: "Average"
    threshold: 70
    alarm_description: "RDS CPU > 70% for 10 minutes"

  # App Error Rate High
  app_errors_high:
    alarm_name: "ravishop-ai-errors-high"
    comparison_operator: "GreaterThanThreshold"
    evaluation_periods: 1
    metric_name: "5XXError"
    namespace: "AWS/ApplicationELB"
    period: 60
    statistic: "Sum"
    threshold: 10
    alarm_description: "More than 10 errors in 1 minute"

  # RDS Low Storage
  rds_storage_low:
    alarm_name: "ravishop-ai-rds-storage-low"
    comparison_operator: "LessThanThreshold"
    evaluation_periods: 1
    metric_name: "FreeStorageSpace"
    namespace: "AWS/RDS"
    period: 300
    statistic: "Average"
    threshold: 5000000000
    alarm_description: "RDS free storage < 5GB"
