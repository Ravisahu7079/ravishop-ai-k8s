global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Flask App metrics
  - job_name: 'ravishop-ai'
    static_configs:
      - targets: ['ravishop-ai-service:5000']
    metrics_path: '/metrics'

  # Kubernetes metrics
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

  # Node metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
